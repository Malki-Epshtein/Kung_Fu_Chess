# Stateless byte-forwarding proxy - safe to scale freely, unlike
# matchmaker/game-allocator (see their own files' comments). Discovers
# shards dynamically from shard.heartbeat over NATS instead of a static
# shard list (see shared/discovery/ShardRegistry.h) - no dependency on the
# gameserver Deployment/Service at all, only on NATS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      containers:
        - name: ws-gateway
          image: kung-fu-chess/ws-gateway:latest
          # Always - see gameserver.yaml's comment on this same setting for why
          # IfNotPresent silently serves a stale rebuild on this cluster.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: NATS_URL
              value: "nats://nats:4222"
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
spec:
  # LoadBalancer - K3s ships a built-in ServiceLB ("Klipper") that makes
  # this actually work on a local single-node cluster (assigns a real
  # reachable external IP), unlike vanilla kubeadm k8s which would need
  # MetalLB or a cloud provider's LB for this type to do anything.
  type: LoadBalancer
  selector:
    app: ws-gateway
  ports:
    # External port matches the game server's old port on purpose - the
    # existing client (GraphicalApplication.h: ws://<host>:9002) needs no
    # client-side change, same reasoning as docker-compose.yml's
    # "9002:8080" mapping.
    - port: 9002
      targetPort: 8080
