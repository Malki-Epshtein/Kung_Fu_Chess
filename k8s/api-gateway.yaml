# REST half of the Gateway (login/rooms/history) - stateless, safe to
# scale freely. Needs both Redis (room directory + session store) and NATS
# (dynamic shard discovery, same as ws-gateway.yaml). Postgres is optional -
# GET /history just returns an empty list without DATABASE_URL set (see
# ApiGateway.cpp) - but wired here the same as gameserver.yaml's so the real
# path is what's actually running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # See gameserver.yaml's comment on `enableServiceLinks: false` - same
      # REDIS_PORT auto-injection collision applies here (this service also
      # connects to Redis, for the room directory + session store).
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: kung-fu-chess/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: API_PORT
              value: "8081"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: REDIS_HOST
              value: "redis"
            - name: DATABASE_URL
              value: "postgresql://kfc:kfc@postgres:5432/kfc"
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  # LoadBalancer - see ws-gateway.yaml's comment on K3s's built-in ServiceLB.
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    # Matches GraphicalApplication.h's API_PORT.
    - port: 8081
      targetPort: 8081
